services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Go Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_URL: "host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-orchestrix} port=5432 sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-secure-random-string}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - upload_storage:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Python AI / RAG Service ----
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      HOST: "0.0.0.0"
      PORT: "8000"
      STORAGE_PATH: /shared-storage
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - upload_storage:/shared-storage/storage/uploads

  # ---- React Frontend (Vite + Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_storage:
